# Environment
env = NIXOS_OZONE_WL,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = XDG_SCREENSHOTS_DIR,$HOME/screens
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
env = AQ_NO_MODIFIERS,1

monitor = DP-1,3840x2160@60,0x0,2
monitor = eDP-1,1920x1080@144,1080,1

$mainMod = ALT
$terminal = kitty
$menu = wofi

exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprsunset

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    layout = master
    col.active_border = rgb(7aa2f7) rgb(7aa2f7) 45deg
    col.inactive_border = rgb(444b6a)
}

decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow { enabled = false }
    blur { enabled = false }
}

animations {
    enabled = true
    bezier = expressiveFastSpatial, 0.42, 1.2, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.1, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08

    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}

input {
    kb_layout = us
    kb_options = grp:caps_toggle
    kb_options = ctrl:swapcaps
}

gesture = 3, horizontal, workspace

dwindle { preserve_split = true }

master {
    new_status = slave
    new_on_top = true
    mfact = 0.5
}

misc {
    vrr = 1
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

workspace = special:chats, on-created-empty:kitty
windowrulev2 = workspace special:chats silent, class:(ZapZap)
windowrulev2 = workspace special:chats silent, class:(signal)
windowrulev2 = workspace special:chats silent, class:(org.telegram.desktop)
windowrulev2 = suppress_event maximize, class:.*
windowrulev2 = no_focus 1, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pin:0
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = no_anim 1, class:^(xwaylandvideobridge)$
windowrulev2 = no_initial_focus 1, class:^(xwaylandvideobridge)$
windowrulev2 = max_size 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = no_blur 1, class:^(xwaylandvideobridge)$
windowrulev2 = no_focus 1, class:^(xwaylandvideobridge)$
workspace = f[1], gapsout:0, gapsin:0

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, B, exec, pkill -SIGUSR2 waybar
bind = $mainMod SHIFT, B, exec, pkill -SIGUSR1 waybar
bind = $mainMod CTRL, Escape, exec, hyprlock --grace 0
bind = $mainMod, E, exec, $menu --show drun
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod, V, exec, cliphist list | $menu --dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, E, exec, bemoji -cn
bind = $mainMod SHIFT, P, exec, hyprpicker -an
bind = , Print, exec, grimblast --notify --freeze copysave screen
bind = $mainMod, Print, exec, grimblast --notify --freeze copysave area
bind = $mainMod SHIFT, D, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pin,
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, Tab, cyclenext
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod CTRL, H, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, L, movecurrentworkspacetomonitor, r
bind = $mainMod CTRL, K, movecurrentworkspacetomonitor, u
bind = $mainMod CTRL, J, movecurrentworkspacetomonitor, d
bind = $mainMod CTRL SHIFT, H, resizeactive, -60 0
bind = $mainMod CTRL SHIFT, L, resizeactive, 60 0
bind = $mainMod CTRL SHIFT, K, resizeactive, 0 -60
bind = $mainMod CTRL SHIFT, J, resizeactive, 0 60
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, C, togglespecialworkspace, chats
bind = $mainMod SHIFT, C, movetoworkspace, special:chats
bind = $mainMod, M, togglespecialworkspace, music
bind = $mainMod SHIFT, M, movetoworkspace, special:music
bind = $mainMod, O, togglespecialworkspace, btop
bind = $mainMod SHIFT, O, movetoworkspace, special:btop
bind = $mainMod, T, togglespecialworkspace, todo
bind = $mainMod SHIFT, T, movetoworkspace, special:todo
bind = $mainMod SHIFT, N, exec, hyprctl hyprsunset temperature 4000
bind = $mainMod CTRL, N, exec, hyprctl hyprsunset identity
